<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Browsers that understand the SVG take it and stay sharp at any scale; the
         .ico carries hand-rendered 16-256px bitmaps for the ones that do not. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0F14" />
    <meta
      name="description"
      content="PersonalMoney - track accounts, transactions and transfers across currencies, and see where your money actually goes."
    />
    <!-- Square-cornered on purpose: iOS applies its own mask and paints transparent
         corners black. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>PersonalMoney — personal finance, clearly</title>

    <script>
      // Applied before first paint: without this the saved theme is only set once
      // React mounts, which shows a flash of dark on a light-theme reload. Mirrors
      // readThemeMode() in src/theme.tsx, including the uppercase values the Compose
      // client stored, and "system" (or nothing stored) following the OS.
      (function () {
        try {
          var t = (localStorage.getItem('theme') || '').toLowerCase();
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('lang');
          if (l) document.documentElement.setAttribute('lang', l);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
