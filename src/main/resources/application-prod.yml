spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:personalmoney}
    username: ${DB_USERNAME:personalmoney}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  # Absolute base for links inside emails; a relative link in a mail client goes nowhere.
  base-url: ${APP_BASE_URL:}
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  crypto:
    # Encrypts stored Monobank tokens. Rotating it makes existing links unreadable.
    # Unset: generated into <data-dir>/secrets on first boot.
    secret: ${CRYPTO_SECRET:}
  jwt:
    # Unset: generated into <data-dir>/secrets on first boot.
    secret: ${JWT_SECRET:}
    # Key must match the @Value in JwtUtils - the old `expiration` was silently ignored.
    # Stays at 24h until /api/auth/refresh exists; shortening it before then would just
    # log the web client out once a day with no way to renew.
    expirationMs: 86400000
