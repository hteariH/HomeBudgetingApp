spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/homebudget}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:homebudget}
    password: ${DB_PASSWORD:homebudget}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # No baseline on purpose. The pre-Flyway production schema was generated by
    # ddl-auto: update, so its constraint names are Hibernate's (FK...), not V1's -
    # baselining would assert a match that does not hold and break later migrations
    # that reference constraints by name. The database is rebuilt from V1 instead;
    # see README for the one-time reset step.

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  # Absolute base for links inside emails; a relative link in a mail client goes nowhere.
  base-url: ${APP_BASE_URL:https://personalmoney.app}
  mail:
    from: ${APP_MAIL_FROM:noreply@personalmoney.app}
  crypto:
    # Encrypts stored Monobank tokens. Rotating it makes existing links unreadable.
    secret: ${APP_CRYPTO_SECRET:}
  jwt:
    secret: ${JWT_SECRET}
    # Key must match the @Value in JwtUtils - the old `expiration` was silently ignored.
    # Stays at 24h until /api/auth/refresh exists; shortening it before then would just
    # log the web client out once a day with no way to renew.
    expirationMs: 86400000
