spring:
  application:
    name: homebudgeting
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false

server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.homebudget: DEBUG
