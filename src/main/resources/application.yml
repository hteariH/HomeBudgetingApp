spring:
  application:
    name: homebudgeting
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Instants are written and read as UTC regardless of the host's timezone.
          # Sync ordering compares these across clients, so an offset would silently
          # reorder edits.
          time_zone: UTC

server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always

# The OpenAPI document is the contract shared with the Android and React clients.
# Off by default so a public deployment does not publish its own API surface;
# the local profile turns it back on for generating the spec.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # Where state lives. Generated secrets are kept in <data-dir>/secrets.
  data-dir: ${DATA_DIR:/data}
  # open | closed. Unset: open while the instance has no users, closed afterwards.
  # An administrator can flip it at runtime unless this is set.
  instance:
    registration: ${REGISTRATION:}
  homemoney:
    base-url: ${HOMEMONEY_BASE_URL:https://homemoney.ua}
    # Until an application is registered with homemoney.ua, their published demo client
    # is what the OAuth endpoints accept.
    client-id: ${HOMEMONEY_CLIENT_ID:5}
    client-secret: ${HOMEMONEY_CLIENT_SECRET:demo}
    # The username-and-password grant, for development against an unregistered client.
    # Off here on purpose: the redirect flow exists so this server never sees somebody's
    # HomeMoney password, and a flag that quietly stays on undoes that.
    allow-password-grant: ${HOMEMONEY_ALLOW_PASSWORD_GRANT:false}
  monobank:
    corporate:
      # Monobank's corporate API, which is what lets somebody connect their account by
      # approving it in the Monobank app instead of pasting a personal token nobody wants
      # to hand over. Both values come from registering this deployment as a company with
      # the bank - see docs/monobank-corporate.md.
      #
      # Empty, as on every machine that has not registered, means the bank list offers the
      # personal-token provider alone rather than an option that could only ever fail.
      key-id: ${MONOBANK_KEY_ID:}
      # The secp256k1 signing key: either the PEM itself or a path to the PEM file. Never
      # commit it - it is the credential the whole company registration rests on.
      private-key: ${MONOBANK_PRIVATE_KEY:}
      # How long to keep waiting for the customer to approve a request. The bank keeps it
      # open for 24 hours; a dialog nobody is looking at any more should not.
      consent-timeout: ${MONOBANK_CONSENT_TIMEOUT:10m}

logging:
  level:
    com.homebudget: DEBUG
