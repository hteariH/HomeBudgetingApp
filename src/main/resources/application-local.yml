spring:
  datasource:
    # Project-relative so the profile works on any machine.
    # Use jdbc:h2:mem:homebudgetdb;... instead if you want a throwaway DB each run.
    url: jdbc:h2:file:./data/homebudgetdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Local only: a checksum mismatch rebuilds the DB from scratch instead of failing.
    clean-on-validation-error: true
    # No default-schema on purpose: DATABASE_TO_LOWER=TRUE makes H2's default schema
    # `public`, so pinning it to `PUBLIC` fails with "Schema not found".
  sql:
    init:
      mode: never

  # Off unless MAIL_HOST is supplied: links are written to the log instead. Set MAIL_HOST
  # and the credentials (plus APP_MAIL_LOG_ONLY=false) to send for real from a developer
  # machine - useful once, to prove a provider is set up, without deploying anything.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  base-url: ${APP_BASE_URL:http://localhost:8085}
  data-dir: ./data
  # Not a secret worth protecting - it is a throwaway local database - but SecretCrypto
  # needs *a* key, and without one every third-party credential (a Monobank token, a
  # HomeMoney authorisation) fails to store with a 500.
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-at-least-32-characters}
  crypto:
    secret: ${APP_CRYPTO_SECRET:local-development-storage-key-at-least-32-chars}
  mail:
    from: ${APP_MAIL_FROM:noreply@personalmoney.app}
    # Default: write the link to the log instead of sending, so the flow can be walked
    # through with no mail server at all.
    log-only: ${APP_MAIL_LOG_ONLY:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.homebudget: DEBUG
