name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Backend only: the React bundle is built inside the Docker image, and skipping
      # it here keeps the gate fast. Migrations run against H2 with ddl-auto=validate,
      # so a schema that drifts from the entities fails the build here.
      - name: Run tests
        run: ./mvnw -B -Dfrontend.skip=true test

  client:
    name: Client Tests & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The client has an Android target, so Gradle configures AGP even for a wasm-only
      # task, and compileSdk is newer than the runner's preinstalled platforms.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The web bundle is made of commonMain, and these are the tests that guard it.
      - name: Run client tests
        working-directory: client
        run: ./gradlew testDebugUnitTest

      - name: Build the bundle
        working-directory: client
        run: ./gradlew wasmJsBrowserDistribution

      - name: Collect
        run: |
          set -euo pipefail
          dist=client/composeApp/build/dist/wasmJs/productionExecutable
          test -f "$dist/index.html" || { echo "::error::no index.html in $dist"; exit 1; }
          mkdir -p web-dist
          cp -r "$dist"/. web-dist/
          echo "Bundle: $(du -sh web-dist | cut -f1)"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, client]
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Into ./web-dist, which is what the Dockerfile copies into the jar's
      # static/app. Built by the `client` job in this same run - no release, no token,
      # and no way for the server and the client it serves to be different versions.
      - name: Download the web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Check the bundle arrived
        run: |
          set -euo pipefail
          test -f web-dist/index.html || { echo "::error::web-dist has no index.html" >&2; exit 1; }
          echo "Bundle: $(du -sh web-dist | cut -f1)"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lower
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lower.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml
          target: /opt/homebudget

      # Ship the edge site config so the shared proxy routes personalmoney.app to us.
      - name: Copy edge site config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/personalmoney.caddy
          target: /opt/edge/conf.d
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/homebudget

            # Everything else comes from /opt/homebudget/.env, which compose reads on its
            # own and which no deploy ever writes to. The image tag is derived here
            # rather than stored, since it is not a secret.
            if [ ! -f .env ]; then
              echo "Missing /opt/homebudget/.env - copy it from .env.example and chmod 600" >&2
              exit 1
            fi
            DOCKER_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]'):latest

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # The shared edge network is created once on the VPS; tolerate it existing.
            sudo docker network create edge 2>/dev/null || true

            # `sudo env VAR=...` rather than `sudo -E`: this host's sudoers refuses to
            # preserve the environment, so -E is silently dropped and compose sees no
            # image. Everything else compose needs comes from .env, which it reads itself.
            sudo env DOCKER_IMAGE="$DOCKER_IMAGE" docker compose pull
            sudo env DOCKER_IMAGE="$DOCKER_IMAGE" docker compose up -d --remove-orphans

            # Refresh the shared edge proxy so the site config takes effect.
            sudo docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile

            sudo docker image prune -f
