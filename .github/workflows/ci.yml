name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Backend only: the React bundle is built by the image. Docker is available on the
      # runner, so the Testcontainers Postgres suite runs here.
      - run: ./mvnw -B -Dfrontend.skip=true test

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  site:
    name: Landing site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # `packages` named explicitly: the action's default also asks for the legacy
      # `tools` package, which current cmdline-tools no longer carry.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: client
        run: ./gradlew testDebugUnitTest assembleDebug

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: this is the scan that covers every commit before the repository
      # is made public.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
