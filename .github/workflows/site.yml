name: Site

on:
  push:
    branches: [master]
    paths: ['site/**', 'deploy/docker-compose.site.yml', 'deploy/personalmoney.caddy']

# Two quick merges must not interleave their copy and restart steps.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci && npm test && npm run build
      - name: Copy the site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: site/dist,deploy/docker-compose.site.yml
          target: /opt/personalmoney-site
      - name: Copy the edge config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/personalmoney.caddy
          target: /opt/edge/conf.d
          strip_components: 1
      - name: Start and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/personalmoney-site
            # Replace the contents in place: nginx bind-mounts ./dist, and swapping the
            # directory itself would leave the running container on the deleted one.
            mkdir -p dist && find dist -mindepth 1 -delete && cp -a site/dist/. dist/ && rm -rf site
            sudo docker compose -f deploy/docker-compose.site.yml --project-directory . up -d
            sudo docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile
