# PersonalMoney - self-hosted personal and family finances.
#
#   cp .env.example .env      # set DB_PASSWORD, nothing else is required
#   docker compose up -d
#   open http://<this machine>:8080 and create the administrator account
#
# ./data is created on first start and owned by the app's user.
#
# Put it behind your own reverse proxy (Caddy, Traefik, Nginx Proxy Manager, Tailscale)
# for HTTPS; see the README.
services:
  app:
    image: ghcr.io/htearih/personalmoney:${PERSONALMONEY_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PERSONALMONEY_PORT:-8080}:8080"
    # Every setting is interpolated here rather than read with env_file, so the same file
    # works with a .env next to it, with Portainer's stack variables and with TrueNAS's
    # "Install via YAML" - and with Compose versions older than 2.24, which NAS bundles
    # often ship. Defaults repeat the application's own: a variable set to an empty
    # string would otherwise replace them.
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REGISTRATION: ${REGISTRATION:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CRYPTO_SECRET: ${CRYPTO_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      MONOBANK_KEY_ID: ${MONOBANK_KEY_ID:-}
      MONOBANK_PRIVATE_KEY: ${MONOBANK_PRIVATE_KEY:-}
      HOMEMONEY_CLIENT_ID: ${HOMEMONEY_CLIENT_ID:-5}
      HOMEMONEY_CLIENT_SECRET: ${HOMEMONEY_CLIENT_SECRET:-demo}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-5m}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
    volumes:
      # Generated secrets live here (and, later, receipt images). Back it up.
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: personalmoney
      POSTGRES_USER: personalmoney
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalmoney -d personalmoney"]
      interval: 10s
      timeout: 5s
      retries: 5
