<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A63E6"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- subtle decorative shapes -->
  <circle cx="910" cy="70" r="240" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="80" cy="450" r="170" fill="#FFFFFF" opacity="0.05"/>
  <polyline points="60,370 250,300 380,335 540,235 720,265 980,150"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.10"
            stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- app icon tile (wallet) -->
  <g transform="translate(110,150)">
    <rect width="200" height="200" rx="48" fill="url(#tile)"/>
    <g transform="translate(100,100) scale(1.7) translate(-54,-54)">
      <path fill="#C7D2FE" d="M48,33 H64 a4,4 0 0 1 4,4 V45 H44 V37 a4,4 0 0 1 4,-4 Z"/>
      <path fill="#FFFFFF" d="M38,42 H72 a8,8 0 0 1 8,8 V66 a8,8 0 0 1 -8,8 H38 a8,8 0 0 1 -8,-8 V50 a8,8 0 0 1 8,-8 Z"/>
      <path fill="#4338CA" d="M64,52 H74 a3,3 0 0 1 3,3 V61 a3,3 0 0 1 -3,3 H64 a3,3 0 0 1 -3,-3 V55 a3,3 0 0 1 3,-3 Z"/>
      <path fill="#FFFFFF" d="M67,55 a3,3 0 1 0 0,6 a3,3 0 1 0 0,-6 Z"/>
    </g>
  </g>

  <!-- text block -->
  <text x="362" y="232" font-family="Roboto, Arial, Helvetica, sans-serif"
        font-size="78" font-weight="700" fill="#FFFFFF">PersonalMoney</text>
  <text x="364" y="292" font-family="Roboto, Arial, Helvetica, sans-serif"
        font-size="33" font-weight="400" fill="#C7D2FE">Track your finances, fully on-device</text>

  <!-- feature chips -->
  <g font-family="Roboto, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#1E1B4B">
    <rect x="364" y="332" width="150" height="44" rx="22" fill="#E0E7FF"/>
    <text x="384" y="361">Budgets</text>
    <rect x="528" y="332" width="220" height="44" rx="22" fill="#E0E7FF"/>
    <text x="548" y="361">Multi-currency</text>
    <rect x="762" y="332" width="186" height="44" rx="22" fill="#E0E7FF"/>
    <text x="782" y="361">No cloud</text>
  </g>
</svg>
