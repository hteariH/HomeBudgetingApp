<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PersonalMoney</title>

    <!-- Sends a signed-out visitor to the sign-in page, and does it here.

         The app makes this decision too, and has to: a session can die while it is
         running. But it can only make it once seven megabytes of WebAssembly have
         downloaded and compiled, which was some twenty-five seconds of blank page - paid
         by somebody who was never going to be let in, to arrive at a form that could have
         been shown at once.

         Above the preload and the bundle script on purpose. The browser starts fetching
         the moment it parses them, so a check placed after would still send eight
         megabytes down a connection belonging to a page it is leaving.

         Only the presence of the token is checked, never its contents. A stale one still
         boots the app, which refreshes it or fails and redirects the long way round; this
         is a fast path for the common case, not an authorisation decision.
         `pm_access_token` is the same key `session.ts` writes and `BrowserTokenStore.kt`
         reads - the three of them are one contract.

         `replace`, so the address the visitor typed does not sit behind the sign-in page
         as a Back button that only comes back here. `next` carries the screen they asked
         for, so signing in finishes the journey instead of landing on the overview. -->
    <script type="application/javascript">
        (function () {
            var token;
            // Private mode, or site data blocked outright: nothing to find and no way to
            // look. Let the app boot and say what is wrong in its own words.
            try { token = window.localStorage.getItem('pm_access_token'); } catch (e) { return; }
            if (token) return;
            var route = window.location.hash.slice(1);
            window.location.replace(route ? '/login?next=' + encodeURIComponent(route) : '/login');
        })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <!-- Inter is 876 KB and Compose only asks for it once it is composing, which is
         after seven megabytes of wasm have compiled - so the first frames drew boxes
         and no text. Preloading starts it with the bundle instead of after it. Kept
         relative: the app is served from /app/ locally and in production alike, and
         `as="fetch"` because Compose reads the resource with fetch(), not as a CSS
         font face - the wrong `as` would fetch the file a second time. -->
    <link rel="preload" as="fetch" crossorigin
          href="composeResources/com.personalmoney.resources/font/inter_variable.ttf">

    <!-- AdSense. Both values are public - a publisher id appears in the source of every
         page that carries AdSense - so they live here rather than in a secrets file, and
         changing them does not mean rebuilding the wasm bundle.

         Left empty deliberately: `BannerAd` draws nothing at all until both are filled in,
         so an unconfigured build behaves exactly as it did before ads existed. To turn ads
         on, paste the publisher id (ca-pub-…) and the ad unit's slot id below and
         uncomment the loader script.

         Consent is not a code problem here: enable the GDPR/CCPA message under Privacy &
         messaging in the AdSense account and the loader serves it. Without that, ads must
         not be shown to EEA or UK visitors at all. -->
    <meta name="adsense-client" content="">
    <meta name="adsense-slot" content="">
    <!-- <script async crossorigin="anonymous"
                 src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"></script> -->
    <style>
        /* `overflow: hidden` because the page itself must never scroll: Compose fills the
           viewport and scrolls inside its own containers. Without it the app sizes itself
           to window.innerWidth, which counts the scrollbar, so the page ended up 15px
           wider than it could show - a horizontal scrollbar caused by the vertical one. */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0D0F14; }
        /* The wasm bundle is measured in megabytes, so the first frame is not instant.
           This placeholder is replaced by Compose on its first composition. */
        #loading { position: fixed; inset: 0; display: grid; place-items: center;
                   color: #8b93a7; font: 15px/1.4 system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
<div id="loading">Loading PersonalMoney…</div>
<script type="application/javascript" src="personalmoney.js"></script>
</body>
</html>
